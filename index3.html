<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 3 | HC-SR04 Telemetry</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --primary: #00d2ff; --secondary: #3a7bd5; --bg: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { background: var(--card); width: 90%; max-width: 900px; padding: 30px; border-radius: 24px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
        h2 { margin: 0; background: linear-gradient(to right, var(--primary), var(--secondary)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .stats { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { background: rgba(255,255,255,0.05); padding: 20px; border-radius: 16px; flex: 1; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-value { font-size: 2.5em; font-weight: 800; color: var(--primary); }
        .stat-label { font-size: 0.9em; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }
        canvas { max-height: 400px; width: 100% !important; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div>
                <h2>Telemetry Dashboard</h2>
                <div style="font-size: 0.8em; opacity: 0.5;">Студент: Соломчак Петро </div>
            </div>
            <div id="status" style="color: #4ade80;">● Live</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Поточна відстань</div>
                <div class="stat-value"><span id="dist">0</span> <small style="font-size: 0.4em;">см</small></div>
            </div>
        </div>

        <canvas id="mainChart"></canvas>
    </div>

    <script>
        const ctx = document.getElementById('mainChart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Відстань (см)',
                    data: [],
                    borderColor: '#00d2ff',
                    borderWidth: 3,
                    pointRadius: 0,
                    fill: true,
                    backgroundColor: ctx.createLinearGradient(0, 0, 0, 400),
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#64748b' } },
                    y: { min: 0, max: 200, grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#64748b' } }
                }
            }
        });
        chart.data.datasets[0].backgroundColor.addColorStop(0, 'rgba(0, 210, 255, 0.2)');
        chart.data.datasets[0].backgroundColor.addColorStop(1, 'rgba(0, 210, 255, 0)');

        const socket = new WebSocket('ws://' + window.location.hostname + '/ws');
        socket.onmessage = (e) => {
            const data = JSON.parse(e.data);
            document.getElementById('dist').innerText = data.value;
            
            const time = new Date().toLocaleTimeString().split(' ')[0];
            chart.data.labels.push(time);
            chart.data.datasets[0].data.push(data.value);

            if (chart.data.labels.length > 25) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update('none');
        };
    </script>
</body>
</html>
